<!doctype html>
<html lang="es" data-theme="light" data-accent="yellow">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Previene flash al cargar: aplica tema guardado antes de que renderice el DOM -->
		<script>
			(function () {
				var t = localStorage.getItem('theme') || 'light';
				var a = localStorage.getItem('accent') || 'yellow';
				document.documentElement.setAttribute('data-theme', t);
				document.documentElement.setAttribute('data-accent', a);
			})();
		</script>

		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/logo.svg" type="image/svg+xml" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
		<link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-180x180.png" />
		<link rel="apple-touch-icon" sizes="76x76" href="/apple-touch-icon-180x180.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
